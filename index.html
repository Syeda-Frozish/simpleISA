<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleISA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>SimpleISA</h1>
    <p>Custom 16-bit CPU toolchain — follow one instruction through the datapath, step by step</p>
  </header>

  <!-- Datapath visualizer -->
  <section class="panel viz">
    <div class="panel-head">
      <h2>Single-cycle datapath</h2>
      <div class="row">
        <button id="step-btn">Step ▶</button>
        <button id="auto-btn" class="secondary">Auto-play</button>
        <button id="run-btn" class="secondary">Run to end ▶▶</button>
        <button id="reset-btn" class="secondary">Reset</button>
        <span class="sep"></span>
        <button id="prev-btn" class="secondary" title="Previous step">◀</button>
        <button id="replay-btn" class="secondary" title="Replay this instruction">↻</button>
        <button id="next-btn" class="secondary" title="Next step">▶</button>
        <select id="speed" title="Animation speed">
          <option value="slow">Slow</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Fast</option>
        </select>
      </div>
    </div>
    <div id="datapath"></div>
    <div id="caption" class="caption"></div>
    <div id="status" class="status">Assemble a program to start.</div>
  </section>

  <main>
    <!-- Left column: code -->
    <section class="panel">
      <div class="panel-head">
        <h2>Assembly</h2>
        <div class="row">
          <select id="example">
            <option value="sum.asm">sum.asm</option>
            <option value="fibonacci.asm">fibonacci.asm</option>
            <option value="array.asm">array.asm</option>
          </select>
          <button id="assemble-btn">Assemble</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false"></textarea>
      <div id="errors"></div>
    </section>

    <!-- Right column: CPU state -->
    <section class="panel">
      <h3 class="first">Program</h3>
      <div class="scroll">
        <table id="listing">
          <thead><tr><th>Addr</th><th>Hex</th><th>Binary</th><th>Source</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <h3>This cycle <span id="cycle-title" class="muted"></span></h3>
      <ol id="steps" class="steps"></ol>

      <div class="two">
        <div>
          <h3>Registers</h3>
          <div id="regs" class="cells"></div>
        </div>
        <div>
          <h3>Data memory <span class="muted">[0..15]</span></h3>
          <div id="dmem" class="cells"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
